# Fabrique l'installateur Windows, l'installe sur une machine Windows et vérifie que l'application démarre.
# Les fichiers sont disponibles dans l'onglet « Actions » (rubrique Artifacts).
# Publication : quand la branche main reçoit une version (champ « version » du package.json) qui n'a pas
# encore de Release, celle-ci est créée automatiquement (étiquette vX.Y.Z, fichiers, notes du CHANGELOG).
name: Application Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests automatiques
        run: npm test

      - name: Fabriquer l'installateur
        run: npx electron-builder --win --x64 --publish never

      - name: Installer l'application (comme un utilisateur, sans droits administrateur)
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist\Installer-BCD-*.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\BCD\BCD.exe"
          if (-not (Test-Path $exe)) { throw "Application non installée : $exe introuvable" }
          Write-Host "Installée : $exe"
          if (-not (Test-Path "$env:USERPROFILE\Desktop\BCD.lnk")) { Write-Warning "Raccourci bureau absent" }

      - name: Lancer l'application installée et vérifier qu'elle démarre
        shell: pwsh
        run: |
          $result = "$env:RUNNER_TEMP\bcd-smoke.txt"
          $env:BCD_SMOKE_TEST = $result
          $env:BCD_DATA_DIR = "$env:RUNNER_TEMP\bcd-data"
          $p = Start-Process -FilePath "$env:LOCALAPPDATA\Programs\BCD\BCD.exe" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "L'application ne s'est pas fermée à temps" }
          if (-not (Test-Path $result)) { throw "Pas de résultat de démarrage" }
          $text = Get-Content $result -Raw
          Write-Host $text
          if (-not $text.StartsWith('OK')) { throw "Échec du démarrage" }
          if (-not (Test-Path "$env:BCD_DATA_DIR\bcd.sqlite")) { throw "Base de données non créée" }

      - name: Tester la version zip (sans installation)
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\BCD-*-sans-installation.zip | Select-Object -First 1
          $dir = "$env:RUNNER_TEMP\bcd-zip"
          Expand-Archive -Path $zip.FullName -DestinationPath $dir -Force
          $result = "$env:RUNNER_TEMP\bcd-smoke-zip.txt"
          $env:BCD_SMOKE_TEST = $result
          $env:BCD_DATA_DIR = "$env:RUNNER_TEMP\bcd-data-zip"
          $p = Start-Process -FilePath "$dir\BCD.exe" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "La version zip ne s'est pas fermée à temps" }
          $text = Get-Content $result -Raw
          Write-Host $text
          if (-not $text.StartsWith('OK')) { throw "Échec du démarrage de la version zip" }

      # Copie des fichiers dans « Artifacts » (pratique pour tester une branche). Si le stockage de GitHub
      # est en panne, on continue : la Release, elle, est publiée par un autre service.
      - name: Mettre les fichiers à disposition
        uses: actions/upload-artifact@v4
        continue-on-error: true
        timeout-minutes: 8
        with:
          name: BCD-Windows
          path: |
            dist/Installer-BCD-*.exe
            dist/BCD-*-sans-installation.zip
          retention-days: 30

      - name: Faut-il publier une nouvelle version ?
        id: rel
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Étiquette $GITHUB_REF_NAME différente de la version du package.json ($VERSION)"; exit 1
          fi
          if [[ "$GITHUB_REF" == refs/heads/main ]] && git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "La version $VERSION est déjà publiée."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Préparer les notes de version (depuis le CHANGELOG)
        if: steps.rel.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const v = process.env.VERSION;
            const log = fs.readFileSync('CHANGELOG.md', 'utf8');
            const start = log.indexOf('## [' + v + ']');
            if (start < 0) { console.error('Version ' + v + ' absente du CHANGELOG'); process.exit(1); }
            const next = log.indexOf('\n## [', start + 1);
            const section = log.slice(start, next < 0 ? undefined : next).split('\n').slice(1).join('\n').trim();
            const help = '\n\n---\n**Télécharger :** \`Installer-BCD-' + v + '.exe\` (installation, sans droits administrateur) '
              + 'ou \`BCD-' + v + '-sans-installation.zip\` (à dézipper puis lancer BCD.exe).\n'
              + 'Les données (Documents\\\\BCD) sont conservées lors de la mise à jour.';
            fs.writeFileSync('release-notes.md', section + help);
          "
          cat release-notes.md

      - name: Publier la version
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.rel.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: BCD ${{ steps.rel.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/Installer-BCD-*.exe
            dist/BCD-*-sans-installation.zip
